name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build ROM using SGDK Docker
        run: |
          # Run as current user to avoid permission issues
          docker run --rm -v "$PWD:/src" -w /src -e GDK=/sgdk --user $(id -u):$(id -g) ghcr.io/stephane-d/sgdk:latest -f /sgdk/makefile.gen
          
      - name: Find ROM file
        run: |
          echo "Looking for ROM..."
          ls -la out/ 2>/dev/null || echo "No out directory"
          find . -name "*.bin" -o -name "*.md" 2>/dev/null | head -5
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/*.bin
            out/*.md
          if-no-files-found: warn
