name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Explore SGDK Docker structure
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/stephane-d/sgdk:latest ls -la /
          echo "---"
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/stephane-d/sgdk:latest ls -la /sgdk/ 2>/dev/null || echo "No /sgdk"
          echo "---"
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/stephane-d/sgdk:latest which make
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/stephane-d/sgdk:latest make --version
          
      - name: Build ROM
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GDK=/sgdk ghcr.io/stephane-d/sgdk:latest make -f /sgdk/makefile.gen
          
      - name: Find ROM file
        run: |
          echo "Looking for ROM..."
          ls -la out/ 2>/dev/null || echo "No out directory"
          find . -name "*.bin" -o -name "*.md" 2>/dev/null | head -5
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/*.bin
            out/*.md
          if-no-files-found: warn
