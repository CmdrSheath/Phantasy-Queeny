name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build ROM using SGDK Docker
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/stephane-d/sgdk:latest \
            bash -c "export GDK=/sgdk && make -f /sgdk/makefile.gen"
          
      - name: Find ROM file
        run: |
          echo "Looking for ROM..."
          ls -la out/ 2>/dev/null || echo "No out directory"
          find . -name "*.bin" -o -name "*.md" 2>/dev/null | head -5
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/*.bin
            out/*.md
          if-no-files-found: warn
