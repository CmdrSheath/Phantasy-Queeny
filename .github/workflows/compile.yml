name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget unzip
          
      - name: Download SGDK
        run: |
          wget -q https://github.com/Stephane-D/SGDK/archive/refs/tags/v2.00.tar.gz
          tar -xzf v2.00.tar.gz
          mv SGDK-2.00 sgdk
          ls -la sgdk/
          
      - name: Setup SGDK environment
        run: |
          echo "GDK=$(pwd)/sgdk" >> $GITHUB_ENV
          echo "GDK_WIN=$(pwd)/sgdk" >> $GITHUB_ENV
          
      - name: Create output directory
        run: mkdir -p out
        
      - name: Compile ROM
        run: |
          export GDK=$(pwd)/sgdk
          export GDK_WIN=$(pwd)/sgdk
          cd $GDK
          ls -la bin/
          cd $GITHUB_WORKSPACE
          $GDK/bin/make -f $GDK/makefile.gen
        continue-on-error: true
        
      - name: Check if ROM was created
        run: |
          ls -la out/ || echo "No out directory"
          find . -name "*.bin" -type f || echo "No .bin files found"
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: out/rom.bin
          if-no-files-found: ignore
