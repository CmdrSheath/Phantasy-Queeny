name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/stephane-d/sgdk:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Compile ROM
        run: |
          echo "GDK=/sgdk"
          export GDK=/sgdk
          ls -la /sgdk/
          make -f /sgdk/makefile.gen
          
      - name: Find ROM file
        run: |
          echo "Looking for ROM..."
          ls -la out/
          find . -name "*.bin" -o -name "*.md" | head -5
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/*.bin
            out/*.md
          if-no-files-found: warn
