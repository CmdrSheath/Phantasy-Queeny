name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget unzip openjdk-11-jre-headless
          
      - name: Download and setup SGDK
        run: |
          wget -q https://github.com/Stephane-D/SGDK/archive/refs/tags/v2.00.tar.gz
          tar -xzf v2.00.tar.gz
          mv SGDK-2.00 sgdk
          echo "SGDK downloaded, checking structure:"
          ls -la sgdk/
          echo "Checking for bin directory:"
          ls -la sgdk/bin/ 2>/dev/null || echo "No bin folder"
          echo "Checking for make:"
          find sgdk -name "make*" -type f 2>/dev/null || echo "No make found"
          
      - name: Setup environment and compile
        run: |
          export GDK=$(pwd)/sgdk
          echo "GDK=$GDK"
          
          # Create necessary directories
          mkdir -p out
          
          # Try to compile using SGDK's makefile
          if [ -f "$GDK/bin/make" ]; then
            echo "Found make in bin/"
            $GDK/bin/make -f $GDK/makefile.gen
          elif [ -f "$GDK/make" ]; then
            echo "Found make in root"
            $GDK/make -f $GDK/makefile.gen
          else
            echo "Trying system make with SGDK makefile..."
            make -f $GDK/makefile.gen
          fi
          
      - name: Find ROM file
        run: |
          echo "Looking for ROM files..."
          find . -name "*.bin" -o -name "*.md" -o -name "*.gen" 2>/dev/null
          ls -la out/ 2>/dev/null || echo "No out directory"
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/*.bin
            out/*.md
            *.bin
            *.md
          if-no-files-found: warn
