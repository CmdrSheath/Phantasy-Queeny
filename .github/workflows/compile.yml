name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-i686 lib32z1
          
      - name: Setup SGDK
        run: |
          wget -q https://github.com/Stephane-D/SGDK/archive/refs/tags/v2.00.tar.gz
          tar -xzf v2.00.tar.gz
          mv SGDK-2.00 SGDK
          echo "GDK=$(pwd)/SGDK" >> $GITHUB_ENV
          
      - name: Compile ROM
        run: |
          cd $GITHUB_WORKSPACE
          make -f $GDK/makefile.gen
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: out/rom.bin
          if-no-files-found: error
