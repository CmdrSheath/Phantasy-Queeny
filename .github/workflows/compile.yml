name: Compile Phantasy Queeny ROM

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget unzip
          
      - name: Download SGDK
        run: |
          wget -q https://github.com/Stephane-D/SGDK/archive/refs/tags/v2.00.tar.gz
          tar -xzf v2.00.tar.gz
          mv SGDK-2.00 sgdk
          ls -la sgdk/
          ls -la sgdk/bin/
          
      - name: Setup SGDK environment
        run: |
          echo "GDK=$(pwd)/sgdk" >> $GITHUB_ENV
          
      - name: Create output directory
        run: mkdir -p out
        
      - name: Compile ROM
        run: |
          export GDK=$(pwd)/sgdk
          echo "GDK=$GDK"
          echo "Current directory: $(pwd)"
          ls -la
          echo "Contents of src/:"
          ls -la src/
          $GDK/bin/make -f $GDK/makefile.gen 2>&1 || echo "Make failed, checking for ROM anyway"
          
      - name: Find all files after build
        run: |
          echo "Current directory contents:"
          ls -la
          echo "Looking for .bin files:"
          find . -name "*.bin" -type f 2>/dev/null || echo "No .bin files"
          echo "Looking for out/ directory:"
          ls -la out/ 2>/dev/null || echo "No out directory"
          echo "Looking for any ROM files:"
          find . -name "rom*" -type f 2>/dev/null || echo "No rom files"
          
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantasyQueeny-ROM
          path: |
            out/rom.bin
            *.bin
            rom.bin
          if-no-files-found: warn
